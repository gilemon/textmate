name: CI

on: [push]

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup
      run: brew install boost capnp google-sparsehash multimarkdown ninja ragel
    - name: Configure
      run: ./configure
    - name: Build
      run: ninja TextMate
